upstream nident_frontend { server frontend:4321; }
upstream nident_php { server backend:9000; }

# Private API listener. This port is never published to the host.
server {
    listen 8081;
    server_name _;
    client_max_body_size 1m;
    location /api/v1/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass nident_php;
        fastcgi_read_timeout 30s;
    }
    location / { return 404; }
}

# HTTP staging entry; production must terminate TLS at a trusted proxy in front.
server {
    listen 80;
    server_name _;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ ^/api/v1/(public/|health/) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass nident_php;
    }
    location /api/v1/ { return 404; }
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://nident_frontend;
        proxy_read_timeout 30s;
    }
}
